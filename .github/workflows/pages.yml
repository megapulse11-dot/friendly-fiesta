name: Deploy the public site to GitHub Pages

# The repository holds two different things:
#   * the public website  - safe to publish
#   * admin/              - the local editing panel and its PowerShell server,
#                           which must never be published
#
# GitHub Pages would otherwise serve the repository root as-is and expose
# admin/ to the internet. So this workflow builds the site explicitly, from a
# list, and nothing else is ever uploaded.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated files match data.json
        shell: bash
        run: |
          set -euo pipefail
          # sitemap.xml and the JSON-LD blocks in the page heads are both generated
          # from data.json (scripts/build-sitemap.mjs, build-structured-data.mjs),
          # and the admin panel regenerates them on every save. This is the backstop
          # for a hand-edited data.json pushed without opening the panel.
          #
          # Both matter for the same reason and it is not tidiness. A sitemap that
          # disagrees with the listings tells crawlers the site has fewer homes than
          # it does; a JSON-LD block that disagrees with the page is a description
          # of something that is not there. The FAQ case is the sharpest - structured
          # data quoting answers the contact page no longer shows.
          #
          # Deliberately checks rather than regenerates. Publishing a file the
          # repository does not contain means the live site and the git history
          # disagree, and the next build would fail again for a different reason.
          for script in build-sitemap.mjs build-structured-data.mjs build-property-pages.mjs; do
            if [ ! -f "scripts/$script" ]; then
              echo "::error::scripts/$script is missing - the generated files can no longer be verified."
              exit 1
            fi
            echo "--- $script ---"
            node "scripts/$script" --check
          done

      - name: Assemble the public site only
        shell: bash
        run: |
          set -euo pipefail
          site=_site
          rm -rf "$site"
          mkdir -p "$site"

          # Pages, scripts and styles that make up the public site.
          #
          # agent.html is the agent portal - sign in, upload, manage listings. It
          # is static like everything else here; the uploads go to the worker, not
          # to this site. Its listing script is listed separately because it is
          # only ever used by that one page.
          #
          # theme.js is the theme bootstrap. It is a separate file rather than an
          # inline <script> precisely so that the pages can ship a CSP without
          # 'unsafe-inline', which means it has to be published like any other
          # script - leave it out and the theme silently stops working on the
          # published site while working perfectly on localhost.
          for file in index.html properties.html property.html contact.html \
                      app.js styles.css data.js favicon.svg theme.js \
                      agent.html agent.js agent.css robots.txt sitemap.xml; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing $file - the site would break."
              exit 1
            fi
            cp "$file" "$site/"
          done

          # The pre-rendered listing pages, one file per listing. property.html
          # stays published too: it is what serves ?id= for any link that still
          # uses it, and app.js points its canonical at these files so the two do
          # not compete for the same house.
          #
          # Copied rather than generated here, because the generator has already
          # run and been verified above - and because publishing a file the
          # repository does not contain would mean the live site and the git
          # history disagree, with the next build failing for a different reason.
          if [ ! -d property ]; then
            echo "::error::property/ is missing - the pre-rendered listing pages are gone."
            exit 1
          fi
          count=$(find property -name '*.html' | wc -l)
          echo "Pre-rendered listing pages: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::property/ has no pages - every listing would 404 for a crawler."
            exit 1
          fi
          cp -R property "$site/"

          # Property images, including anything uploaded through the panel.
          cp -R assets "$site/"

          # Publish as-is: no Jekyll processing, no underscore directories.
          touch "$site/.nojekyll"

          echo "Publishing:"
          find "$site" -type f | sed "s|^$site/|  |"

      - name: Check nothing sensitive slipped in
        shell: bash
        run: |
          set -euo pipefail
          # Matched against the path relative to _site. An absolute path can
          # contain "admin" by accident (a checkout directory, for one) and
          # grep is case-sensitive, so a naive pattern flags everything.
          bad=$(find _site -type f | sed 's|^_site/||' | \
                grep -Ei '(^|/)(admin|\.git)(/|$)|(^|/)enquiries|^data\.json$|^\.env' || true)
          if [ -n "$bad" ]; then
            echo "::error::Refusing to publish:"
            echo "$bad"
            exit 1
          fi
          echo "Clean: no admin, .git, enquiries, data.json or .env published."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
